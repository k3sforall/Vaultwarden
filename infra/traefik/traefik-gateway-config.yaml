# /var/lib/rancher/k3s/server/manifests/traefik-config-http3.yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local

    # HTTP/3 disabled: k3s ServiceLB + consumer-router only forward TCP, so
    # advertising h3 (UDP) breaks clients (esp. the browser extension) that
    # honor Alt-Svc and switch to QUIC. Keep everything on HTTP/2 over TCP.
    ports:
      web:
        exposedPort: 8089
      websecure:
        exposedPort: 4439
        http3:
          enabled: false

    additionalArguments:
      - "--entryPoints.web.forwardedHeaders.insecure=true"
      - "--entryPoints.websecure.forwardedHeaders.insecure=true"
      - "--entryPoints.web.proxyProtocol.insecure=true"
      - "--entryPoints.websecure.proxyProtocol.insecure=true"

    providers:
      kubernetesGateway:
        enabled: true
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: false
